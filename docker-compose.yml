services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    container_name: cartify_api
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - DB_URL=postgres://postgres:postgres@postgres:5432/cartify?sslmode=disable
      - REDIS_ADDR=redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cartify_network

  # web:
  #   build:
  #     context: ./web
  #     dockerfile: Dockerfile
  #     target: prod
  #     args:
  #       NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
  #   container_name: cartify_web
  #   ports:
  #     - "3000:3000"
  #   env_file:
  #     - ./web/.env
  #   environment:
  #     NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
  #   depends_on:
  #     app:
  #       condition: service_started
  #   restart: unless-stopped
  #   networks:
  #     - cartify_network

  postgres:
    image: postgres:18
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cartify
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cartify"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cartify_network

  redis:
    image: redis:8.6
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cartify_network

volumes:
  postgres_data:
  redis_data:

networks:
  cartify_network:
    driver: bridge
