basePath: /api/v1
definitions:
  dto.AuthResponse:
    properties:
      access_token:
        type: string
    type: object
  dto.CartItemRequest:
    properties:
      product_id:
        type: string
      quantity:
        type: integer
    required:
    - product_id
    - quantity
    type: object
  dto.CartItemResponse:
    properties:
      product:
        $ref: '#/definitions/dto.ProductResponse'
      quantity:
        type: integer
      subtotal:
        type: number
    type: object
  dto.CartResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/dto.CartItemResponse'
        type: array
      total_price:
        type: number
      user_id:
        type: string
    type: object
  dto.CreateOrderRequest:
    properties:
      shipping_address:
        type: string
    required:
    - shipping_address
    type: object
  dto.ImageResponse:
    properties:
      is_primary:
        type: boolean
      url:
        type: string
    type: object
  dto.LoginRequest:
    properties:
      email:
        type: string
      password:
        maxLength: 20
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  dto.OrderItemResponse:
    properties:
      id:
        type: string
      product_id:
        type: string
      product_name:
        type: string
      product_price:
        type: number
      quantity:
        type: integer
      subtotal:
        type: number
    type: object
  dto.OrderResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      items:
        items:
          $ref: '#/definitions/dto.OrderItemResponse'
        type: array
      shipping_address:
        type: string
      status:
        type: string
      total_price:
        type: number
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  dto.PaginatedOrdersResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/dto.OrderResponse'
        type: array
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
    type: object
  dto.ProductResponse:
    properties:
      description:
        type: string
      id:
        type: string
      images:
        items:
          $ref: '#/definitions/dto.ImageResponse'
        type: array
      name:
        type: string
      price:
        type: number
      sku:
        type: string
      slug:
        type: string
    type: object
  dto.RefreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  dto.RegisterRequest:
    properties:
      confirm_password:
        type: string
      email:
        type: string
      first_name:
        maxLength: 30
        type: string
      last_name:
        maxLength: 30
        type: string
      password:
        maxLength: 20
        minLength: 8
        type: string
    required:
    - confirm_password
    - email
    - first_name
    - last_name
    - password
    type: object
  dto.UpdatePasswordRequest:
    properties:
      confirm_password:
        type: string
      new_password:
        maxLength: 20
        minLength: 8
        type: string
      old_password:
        maxLength: 20
        minLength: 8
        type: string
    required:
    - confirm_password
    - new_password
    - old_password
    type: object
  dto.UpdateProfileRequest:
    properties:
      first_name:
        maxLength: 30
        type: string
      last_name:
        maxLength: 30
        type: string
    type: object
  dto.UpdateStatusRequest:
    properties:
      status:
        type: string
    required:
    - status
    type: object
  model.Role:
    enum:
    - customer
    - seller
    - admin
    type: string
    x-enum-varnames:
    - RoleCustomer
    - RoleSeller
    - RoleAdmin
  model.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      first_name:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      is_verified:
        type: boolean
      last_name:
        type: string
      role:
        $ref: '#/definitions/model.Role'
      updated_at:
        type: string
    type: object
  response.Response:
    properties:
      data: {}
      errors: {}
      message:
        type: string
      success:
        type: boolean
    type: object
host: localhost:8080
info:
  contact:
    email: misbahulalam64@gmail.com
    name: Misbahul Alam
    url: https://misbahulalam.com
  description: This is the API documentation for the Cartify Platform, an e-commerce
    solution built with Go, Gin, and PostgreSQL. It provides endpoints for user management,
    product catalog, order processing, and more.
  title: Cartify Platform API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user with email and password to receive JWT access
        and refresh tokens.
      parameters:
      - description: Login credentials
        in: body
        name: login
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Successfully authenticated. Returns access_token and refresh_token.
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  additionalProperties:
                    type: string
                  type: object
              type: object
        "400":
          description: Invalid request payload or validation error.
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Invalid email or password.
          schema:
            $ref: '#/definitions/response.Response'
      summary: User Login
      tags:
      - Auth
  /auth/refresh-token:
    post:
      consumes:
      - application/json
      description: Generate a new access token using a valid refresh token.
      parameters:
      - description: Refresh token
        in: body
        name: refresh
        required: true
        schema:
          $ref: '#/definitions/dto.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Successfully generated new access token.
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.AuthResponse'
              type: object
        "400":
          description: Invalid refresh token or request payload.
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Refresh token expired or unauthorized.
          schema:
            $ref: '#/definitions/response.Response'
      summary: Refresh Access Token
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Create a new user account with first name, last name, email, and
        password.
      parameters:
      - description: Registration details
        in: body
        name: register
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Successfully registered new user.
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Validation error or user already exists.
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal server error during registration.
          schema:
            $ref: '#/definitions/response.Response'
      summary: User Registration
      tags:
      - Auth
  /cart:
    delete:
      consumes:
      - application/json
      description: Delete all items from the authenticated user's cart.
      produces:
      - application/json
      responses:
        "200":
          description: Successfully cleared cart.
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 'Unauthorized: Missing or invalid authentication token.'
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal server error.
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Clear Entire Cart
      tags:
      - Cart
    get:
      consumes:
      - application/json
      description: Retrieve all items in the currently authenticated user's cart.
      produces:
      - application/json
      responses:
        "200":
          description: Successfully retrieved cart.
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.CartResponse'
              type: object
        "401":
          description: 'Unauthorized: Missing or invalid authentication token.'
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal server error.
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Get Current User Cart
      tags:
      - Cart
  /cart/items:
    post:
      consumes:
      - application/json
      description: Add a product to the authenticated user's cart (increments quantity
        if already in cart).
      parameters:
      - description: Product details to add
        in: body
        name: item
        required: true
        schema:
          $ref: '#/definitions/dto.CartItemRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Successfully added item, returns updated cart.
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.CartResponse'
              type: object
        "400":
          description: Invalid request payload or validation error.
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 'Unauthorized: Missing or invalid authentication token.'
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal server error.
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Add Item to Cart
      tags:
      - Cart
    put:
      consumes:
      - application/json
      description: Set the exact quantity of a product in the authenticated user's
        cart.
      parameters:
      - description: Product details to update
        in: body
        name: item
        required: true
        schema:
          $ref: '#/definitions/dto.CartItemRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Successfully updated item, returns updated cart.
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.CartResponse'
              type: object
        "400":
          description: Invalid request payload or validation error.
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 'Unauthorized: Missing or invalid authentication token.'
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal server error.
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Update Cart Item Quantity
      tags:
      - Cart
  /cart/items/{product_id}:
    delete:
      consumes:
      - application/json
      description: Remove a product completely from the authenticated user's cart.
      parameters:
      - description: Product UUID
        in: path
        name: product_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Successfully removed item, returns updated cart.
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.CartResponse'
              type: object
        "400":
          description: Invalid product id format.
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 'Unauthorized: Missing or invalid authentication token.'
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal server error.
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Remove Item from Cart
      tags:
      - Cart
  /orders:
    get:
      consumes:
      - application/json
      description: Retrieve a list of paginated orders for the authenticated user.
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Page limit
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Successfully retrieved orders list.
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.PaginatedOrdersResponse'
              type: object
        "401":
          description: 'Unauthorized: Missing or invalid authentication token.'
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal server error.
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: List User Orders
      tags:
      - Orders
    post:
      consumes:
      - application/json
      description: Checkout the items in the cart and create a pending order.
      parameters:
      - description: Shipping address details
        in: body
        name: order
        required: true
        schema:
          $ref: '#/definitions/dto.CreateOrderRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Successfully created order.
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.OrderResponse'
              type: object
        "400":
          description: Invalid request payload or empty cart.
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 'Unauthorized: Missing or invalid authentication token.'
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal server error.
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Create Order from Cart
      tags:
      - Orders
  /orders/{id}:
    get:
      consumes:
      - application/json
      description: Retrieve details of a specific order.
      parameters:
      - description: Order UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Successfully retrieved order.
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.OrderResponse'
              type: object
        "400":
          description: Invalid order ID format.
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 'Unauthorized: Missing or invalid authentication token.'
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: 'Forbidden: Not allowed to access this order.'
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Order not found.
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal server error.
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Get Order by ID
      tags:
      - Orders
  /orders/{id}/cancel:
    put:
      consumes:
      - application/json
      description: Cancel a pending or processing order.
      parameters:
      - description: Order UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Successfully cancelled order.
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Invalid order ID format or cannot cancel.
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 'Unauthorized: Missing or invalid authentication token.'
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: 'Forbidden: Not authorized to cancel this order.'
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Order not found.
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal server error.
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Cancel Order
      tags:
      - Orders
  /orders/{id}/status:
    put:
      consumes:
      - application/json
      description: Update the status of an order.
      parameters:
      - description: Order UUID
        in: path
        name: id
        required: true
        type: string
      - description: New status value
        in: body
        name: status
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Successfully updated order status.
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Invalid status or transitions.
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 'Unauthorized: Missing or invalid authentication token.'
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: 'Forbidden: Admins/Sellers only.'
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Order not found.
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal server error.
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Update Order Status (Admin/Seller)
      tags:
      - Orders
  /orders/all:
    get:
      consumes:
      - application/json
      description: Retrieve a paginated list of all orders.
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Page limit
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Successfully retrieved all orders.
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.PaginatedOrdersResponse'
              type: object
        "401":
          description: 'Unauthorized: Missing or invalid authentication token.'
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: 'Forbidden: Admins/Sellers only.'
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal server error.
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: List All Orders (Admin/Seller)
      tags:
      - Orders
  /users:
    delete:
      consumes:
      - application/json
      description: Permanently remove the currently authenticated user's account from
        the system.
      produces:
      - application/json
      responses:
        "200":
          description: Successfully deleted user account.
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 'Unauthorized: Missing or invalid authentication token.'
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal server error during account deletion.
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Delete Account
      tags:
      - Users
    get:
      consumes:
      - application/json
      description: Retrieve a list of all registered users. This endpoint is restricted
        to administrators.
      produces:
      - application/json
      responses:
        "200":
          description: Successfully retrieved list of users.
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/model.User'
                  type: array
              type: object
        "401":
          description: 'Unauthorized: Missing or invalid authentication token.'
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: 'Forbidden: Insufficient permissions (Admin only).'
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: List All Users
      tags:
      - Users
  /users/me:
    get:
      consumes:
      - application/json
      description: Retrieve the detailed profile information of the currently authenticated
        user.
      produces:
      - application/json
      responses:
        "200":
          description: Successfully retrieved user profile.
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/model.User'
              type: object
        "401":
          description: 'Unauthorized: Missing or invalid authentication token.'
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: User not found.
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Get Current User Profile
      tags:
      - Users
  /users/profile:
    patch:
      consumes:
      - application/json
      description: Modify the personal details (first name, last name) of the currently
        authenticated user.
      parameters:
      - description: New profile details
        in: body
        name: profile
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Successfully updated profile.
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/model.User'
              type: object
        "400":
          description: Invalid request payload or validation error.
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 'Unauthorized: Missing or invalid authentication token.'
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Update Profile
      tags:
      - Users
  /users/update-password:
    post:
      consumes:
      - application/json
      description: Update the password for the currently authenticated user. Requires
        verifying the old password.
      parameters:
      - description: Current and new password details
        in: body
        name: password
        required: true
        schema:
          $ref: '#/definitions/dto.UpdatePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Successfully updated password.
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Validation error or incorrect old password.
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 'Unauthorized: Missing or invalid authentication token.'
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Change Password
      tags:
      - Users
securityDefinitions:
  BearerAuth:
    description: 'Type "Bearer " followed by a space and then your token. For example:
      "Bearer eyJhbGci..."'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
